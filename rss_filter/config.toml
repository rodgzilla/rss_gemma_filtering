[paths]
seen_entries = "seen_entries.json"

[fetch]
timeout_seconds = 15  # per-feed network timeout; unresponsive feeds are skipped

[vault]
daily_notes_folder = "Daily notes"
output_folder = "Filtered feed"

[embedding]
model = "embeddinggemma-300m-qat-Q4_0"  # label only: llama-server ignores it, but it is part of the store signature
base_url = "http://127.0.0.1:8080/v1"
store_path = "embedding_store.db"
top_k = 5
prompt_style = "none"     # embedding text format: "none" (title body) or "document" (title: … | text: …)
top_quantile = 0.2       # keep the top 20% of general reading entries by embedding score
top_quantile_arxiv = 0.1 # keep the top 5% of arxiv entries by embedding score
decay_lambda = 1.0        # exponential decay weight for score aggregation
umap_model_path = "umap_model.joblib"
umap_growth_threshold = 0.1   # refit UMAP when vault grows by >10%
vault_bg_max = 500            # max vault background points shown in the UMAP panel
