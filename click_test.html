<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Click test</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <style>
    body { margin: 0; padding: 12px; background: #1e1e2e; font-family: sans-serif; color: #cdd6f4; }
    #chart { width: 100%; height: 80vh; }
    #status { margin-top: 8px; font-size: 12px; color: #a6adc8; min-height: 20px; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <!-- URL overlay panel -->
  <div id="url-panel" style="
    display:none; position:fixed; bottom:0; left:0; right:0;
    background:#313244; border-top:1px solid #45475a;
    padding:8px 12px; display:none; align-items:center; gap:8px;
    font-size:12px; z-index:1000;
  ">
    <span style="color:#a6adc8; white-space:nowrap;">🔗</span>
    <input id="url-input" type="text" readonly style="
      flex:1; background:#1e1e2e; color:#cdd6f4; border:1px solid #45475a;
      border-radius:3px; padding:3px 6px; font-size:12px; font-family:monospace;
      cursor:text;
    "/>
    <button onclick="copyUrl()" style="
      background:#2ecc71; color:#1e1e2e; border:none; border-radius:3px;
      padding:3px 10px; font-size:11px; cursor:pointer; white-space:nowrap;
    ">Copy</button>
    <button onclick="closePanel()" style="
      background:transparent; color:#a6adc8; border:1px solid #45475a;
      border-radius:3px; padding:3px 8px; font-size:11px; cursor:pointer;
    ">✕</button>
  </div>

  <div id="status" style="display:none"></div>
  <script>
    function showUrl(url, title) {
      var panel = document.getElementById('url-panel');
      var input = document.getElementById('url-input');
      input.value = url;
      panel.style.display = 'flex';
      input.select();
    }
    function copyUrl() {
      var input = document.getElementById('url-input');
      input.select();
      document.execCommand('copy');
      var btn = document.querySelector('#url-panel button');
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
    }
    function closePanel() {
      document.getElementById('url-panel').style.display = 'none';
    }
  </script>
  <script>
    // Three fake RSS entries with real URLs to test with
    var traces = [{
      type: 'scatter',
      mode: 'markers',
      name: 'Kept',
      x: [1.2, 2.5, 3.1],
      y: [0.8, 1.4, 0.6],
      marker: { color: '#2ecc71', size: 12, opacity: 0.8 },
      text: [
        '<b>Attention Is All You Need</b><br>arxiv.org',
        '<b>Hacker News: Ask HN: Best ML papers 2025</b><br>news.ycombinator.com',
        '<b>UMAP: Uniform Manifold Approximation</b><br>arxiv.org'
      ],
      // customdata holds the URL for each point
      customdata: [
        'https://arxiv.org/abs/1706.03762',
        'https://news.ycombinator.com',
        'https://arxiv.org/abs/1802.03426'
      ],
      hovertemplate: '%{text}<extra></extra>'
    }, {
      type: 'scatter',
      mode: 'markers',
      name: 'Rejected',
      x: [0.4, 1.0, 1.8, 2.9],
      y: [0.3, 0.5, 1.0, 1.8],
      marker: { color: '#bdc3c7', size: 10, opacity: 0.4 },
      text: [
        '<b>Some rejected article</b><br>example.com',
        '<b>Another rejected</b><br>example.com',
        '<b>Yet another</b><br>example.com',
        '<b>Low score entry</b><br>example.com'
      ],
      customdata: [
        'https://example.com/1',
        'https://example.com/2',
        'https://example.com/3',
        'https://example.com/4'
      ],
      hovertemplate: '%{text}<extra></extra>'
    }];

    var layout = {
      title: { text: 'Click test — UMAP points' },
      paper_bgcolor: '#1e1e2e',
      plot_bgcolor: '#2a2a3e',
      font: { color: '#cdd6f4' },
      hovermode: 'closest'
    };

    var div = document.getElementById('chart');
    Plotly.newPlot(div, traces, layout, { responsive: true });

    // Attach click handler
    div.on('plotly_click', function(data) {
      var pt = data.points[0];
      var url = pt.customdata;
      var title = pt.text ? pt.text.replace(/<[^>]+>/g, '').split('\n')[0] : url;
      if (!url) return;
      // Send URL to parent note via postMessage (handled by DataviewJS block)
      window.parent.postMessage({ type: 'rss-viz-click', url: url, title: title }, '*');
    });
  </script>
</body>
</html>
